server:
  port: 8080
  servlet:
    context-path: /api/v1

spring:
  application:
    name: skillbridge-backend
  profiles:
    active: dev

# Security and CORS
skillbridge:
  cors:
    allowed-origins: "http://localhost:3000,http://127.0.0.1:3000,https://ais-dev-yecz6isodgdkfmx2ap547x-814549792044.asia-southeast1.run.app"
  firebase:
    service-account-path: ${FIREBASE_CREDENTIALS_PATH:config/firebase-service-account.json}
    database-url: ${FIREBASE_DATABASE_URL:}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: gemini-3.8-flash

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
